name: 🛢️ Oil Bot 24/7 Cloud Scanner

on:
  schedule:
    # Runs every 30 minutes Monday through Friday (13:00 - 22:00 UTC covers US Market Hours)
    - cron: '*/30 13-22 * * 1-5'
    # Also runs every 2 hours on weekends / off-market for major geopolitical/OPEC weekend news
    - cron: '0 */2 * * 0,6'
  workflow_dispatch:
    inputs:
      test_gemini:
        description: 'Send a test Gemini AI alert to your phone right now'
        type: boolean
        required: true
        default: true
      ntfy_topic:
        description: 'Target ntfy topic (optional override)'
        required: false
        default: 'buzi-bot'

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('vader_lexicon')"

      - name: Run Market & AI News Scan
        env:
          INPUT_TOPIC: ${{ github.event.inputs.ntfy_topic }}
          SECRET_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TEST_GEMINI: ${{ github.event.inputs.test_gemini }}
        run: |
          TARGET_TOPIC="${INPUT_TOPIC:-${SECRET_TOPIC:-buzi-bot}}"
          echo "Using ntfy topic: $TARGET_TOPIC"

          KEY_VAL="${GEMINI_API_KEY:-$GOOGLE_API_KEY}"
          if [ -n "$KEY_VAL" ]; then
            echo "✓ GEMINI_API_KEY is successfully loaded from GitHub Secrets."
          else
            echo "⚠️ WARNING: GEMINI_API_KEY is not detected in GitHub Secrets!"
          fi

          if [ "$TEST_GEMINI" = "true" ]; then
            echo "🚀 Executing Live Gemini LLM Test using your secret..."
            python main.py test-gemini --ntfy "$TARGET_TOPIC"
          else
            echo "🔍 Executing Standard 24/7 Market Scan..."
            python main.py check-and-notify --ntfy "$TARGET_TOPIC"
          fi
