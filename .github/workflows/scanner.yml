name: 🛢️ Brent Crude 24/7 CFD Cloud Engine

on:
  schedule:
    # 24/7 Continuous Watchdog: triggers every 4 hours covering all 24 hours of every day (Sunday-Saturday)
    - cron: '15 */4 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration in minutes to run the continuous 5-minute loop (default: 240 = 4 hours)'
        required: false
        default: '240'
      interval_seconds:
        description: 'Interval between news and price checks in seconds (default: 300 = 5 minutes)'
        required: false
        default: '300'
      send_status_pulse:
        description: 'Send immediate Brent market status pulse to phone on start'
        type: boolean
        required: false
        default: true
      ntfy_topic:
        description: 'Target ntfy topic (optional override)'
        required: false
        default: 'buzi-bot'

permissions:
  contents: write

jobs:
  brent-cfd-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('vader_lexicon')"

      - name: Run Continuous 24/7 Brent Crude CFD Daemon
        env:
          INPUT_TOPIC: ${{ github.event.inputs.ntfy_topic }}
          SECRET_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '240' }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '300' }}
          SEND_PULSE: ${{ github.event.inputs.send_status_pulse || 'true' }}
        run: |
          TARGET_TOPIC="${INPUT_TOPIC:-${SECRET_TOPIC:-buzi-bot}}"
          echo "Using ntfy topic: $TARGET_TOPIC"

          KEY_VAL="${GEMINI_API_KEY:-$GOOGLE_API_KEY}"
          if [ -n "$KEY_VAL" ]; then
            echo "✓ GEMINI_API_KEY is successfully loaded from GitHub Secrets."
          else
            echo "⚠️ WARNING: GEMINI_API_KEY is not detected in GitHub Secrets!"
          fi

          PULSE_ARG=""
          if [ "$SEND_PULSE" = "true" ] || [ -z "${{ github.event.inputs.duration_minutes }}" ]; then
            PULSE_ARG="--pulse"
          fi

          echo "🚀 Launching Brent Crude 24/7 CFD Engine (Duration: ${DURATION_MINUTES}m, Interval: ${INTERVAL_SECONDS}s)..."
          python main.py brent-daemon --duration "$DURATION_MINUTES" --interval "$INTERVAL_SECONDS" --ntfy "$TARGET_TOPIC" $PULSE_ARG

      - name: Persist Daemon State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f daemon_state.json ]; then
            git add daemon_state.json
            git diff --quiet && git diff --staged --quiet || git commit -m "Update Brent CFD daemon state [skip ci]" && git push || true
          fi
