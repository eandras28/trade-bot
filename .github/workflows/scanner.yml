name: 🛢️ Oil Bot 24/7 Cloud Scanner

on:
  schedule:
    # Runs every 30 minutes during US Market Hours (Mon-Fri)
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('vader_lexicon')"

      - name: Run Market & News Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python main.py check-and-notify --ntfy "$NTFY_TOPIC"
